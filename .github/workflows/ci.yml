name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: Electron runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libgtk-3-0t64 libgbm1 libasound2t64

      - name: Smoke test (real Electron under Xvfb)
        run: xvfb-run -a npm run smoke
        env:
          CI: "true"
          # npm-extracted chrome-sandbox loses its setuid bit; CI containers
          # can't fix it, so disable Chromium's sandbox (CI-only).
          ELECTRON_DISABLE_SANDBOX: "true"
