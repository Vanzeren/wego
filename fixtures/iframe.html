<!doctype html>
<html><head><meta charset="utf-8"><title>Inner frame</title></head>
<body>
<p>Inside frame</p>
<button id="frame-btn" type="button">Frame button</button>
<script>
  document.getElementById('frame-btn').addEventListener('click', () => {
    // same-origin host: direct call; cross-origin host: postMessage fallback
    try { parent.__fixture.log('frame-clicked'); }
    catch { parent.postMessage('frame-clicked', '*'); }
  });
</script>
</body></html>
